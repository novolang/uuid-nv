[package]
name        = "uuid-nv"
version     = "0.1.2"
description = "RFC 9562 UUIDs in the two versions worth minting: v4, 122 random bits that reveal nothing, and v7, a millisecond timestamp followed by randomness so that identifiers sort in the order they were made.  Parses either case, prints the canonical lowercase form, and reads the version and variant of a value somebody else minted."
license     = "Apache-2.0"
stability   = "experimental"
category    = "encoding"
tags        = ["uuid", "uuidv7", "uuidv4", "identifier", "rfc9562"]
repository  = "https://github.com/novolang/uuid-nv"
maintainers = ["novo-lang"]
main        = "src/main.nv"

# The README is the package's one page, and its own first heading is the
# package name — which says nothing in a list of this package's pages.
[docs.pages]
"README.md" = "Minting and reading RFC 9562 UUIDs"

[dependencies]
# The random bits.  The widest range this package supports: it calls
# only what rand-nv shipped in its first release.  The millisecond clock
# a v7 needs is `Zoned.now`, which is in the standard library.
rand-nv = "^0.1.0"
